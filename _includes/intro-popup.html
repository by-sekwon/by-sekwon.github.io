<div id="intro-popup" role="dialog" aria-label="사이트 소개" style="display:none;position:fixed;top:72px;right:16px;width:min(300px,62vw);z-index:2000;background:#1e3a2f;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden;">
  <img id="intro-popup-img" alt="권세혁 교수의 통계책방 사이트 소개 슬라이드 (클릭하면 크게 보기)" title="클릭하면 크게 볼 수 있어요" style="display:block;width:100%;height:auto;cursor:zoom-in;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;color:#f5f0e8;">
    <button type="button" id="intro-popup-today" style="background:none;border:0;color:#f5f0e8;cursor:pointer;padding:0;font-size:12px;">오늘 하루 닫기</button>
    <button type="button" id="intro-popup-close" style="background:none;border:0;color:#d4a017;cursor:pointer;padding:0;font-size:12px;font-weight:700;">닫기 ✕</button>
  </div>
</div>
<div id="intro-zoom" style="display:none;position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.8);align-items:center;justify-content:center;cursor:zoom-out;">
  <img id="intro-zoom-img" alt="사이트 소개 슬라이드 확대" style="width:640px;max-width:94vw;max-height:94vh;object-fit:contain;border-radius:8px;">
</div>
<script>
(function () {
  var KEY = "introPopupHiddenUntil";
  var box = document.getElementById("intro-popup");
  if (location.pathname !== "/" && location.pathname !== "/index.html") return;
  try {
    if (Date.now() < Number(localStorage.getItem(KEY) || 0)) return;
  } catch (e) {}
  function hide(days) {
    box.style.display = "none";
    if (days) { try { localStorage.setItem(KEY, String(Date.now() + days * 864e5)); } catch (e) {} }
  }
  document.getElementById("intro-popup-close").onclick = function () { hide(0); };
  document.getElementById("intro-popup-today").onclick = function () { hide(1); };
  var zoom = document.getElementById("intro-zoom");
  function closeZoom() { zoom.style.display = "none"; document.getElementById("intro-zoom-img").removeAttribute("src"); }
  document.getElementById("intro-popup-img").onclick = function () {
    document.getElementById("intro-zoom-img").src = "/images/site_intro.gif";
    zoom.style.display = "flex";
  };
  zoom.onclick = closeZoom;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeZoom(); });
  window.addEventListener("load", function () {
    var img = document.getElementById("intro-popup-img");
    img.onload = function () { box.style.display = "block"; };
    img.src = "/images/site_intro.gif";
  });
})();
</script>
