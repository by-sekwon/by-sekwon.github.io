name: Daily Stock News

on:
  schedule:
    - cron: '10 23 * * *'   # 매일 08:10 KST(UTC+9) = 전날 23:10 UTC
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily stock news
        run: node scripts/fetch_stock_news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playground/data docs/playground/data
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 오늘의 증권가 주식 소식 자동 갱신"
            git push
          fi
