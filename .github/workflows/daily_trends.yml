name: Daily Search Trends

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST(UTC+9) = 전날 23:00 UTC
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright@latest @anthropic-ai/sdk@latest zod@latest
          npx playwright install --with-deps chromium

      - name: Fetch daily trends
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch_trends.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends/data docs/trends/data
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 오늘의 검색 트렌드 자동 갱신"
            git push
          fi
