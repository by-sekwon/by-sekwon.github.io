name: Daily Forest Product Prices

on:
  schedule:
    - cron: '20 23 * * *'   # 매일 08:20 KST(UTC+9) = 전날 23:20 UTC
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 스크립트가 내장 WebSocket을 사용 (Node 22+)

      - name: Fetch forest product auction prices (농넷)
        run: node scripts/fetch_forest_prices.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playground/data/forest_prices docs/playground/data/forest_prices
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: 임업품목 가격정보 자동 갱신"
            git push
          fi
